<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wohnungssuche Leipzig</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#18202a;--muted:#6b7785;--line:#dfe5eb;--accent:#1769e0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1240px;margin:auto;padding:28px 18px 42px}h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.04em;margin:0 0 8px}.lead{color:var(--muted);max-width:820px}.chips,.controls{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 11px;text-decoration:none}.controls{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:20px 0}.controls input,.controls select{border:1px solid var(--line);border-radius:9px;padding:8px;background:transparent;color:inherit}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.stat,.card,.legend,.removed{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.stat b{display:block;font-size:24px}.stat span{color:var(--muted);font-size:12px}.section{margin-top:26px}.section h2{font-size:22px;margin:0 0 12px}.gridcards,.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.card{position:relative}.rank{font-weight:800;color:var(--muted)}.score{position:absolute;right:15px;top:13px;font-size:24px;font-weight:900}.score small{font-size:11px;color:var(--muted)}.card h3{margin:16px 0 2px}.district{margin:0 0 12px;color:var(--muted)}.facts{display:grid;grid-template-columns:1fr 1fr;gap:7px}.fact{background:#f8fafc;border-radius:9px;padding:8px}.fact b{display:block;font-size:11px;color:var(--muted)}.line{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;display:grid;grid-template-columns:105px 1fr;gap:8px}.line b{font-size:12px}.btn{display:inline-block;margin-top:13px;background:var(--accent);color:#fff;text-decoration:none;padding:9px 12px;border-radius:9px;font-weight:700}.note{color:var(--muted);font-size:12px}.legendgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:7px}.legenditem{display:flex;justify-content:space-between;background:#f8fafc;border-radius:9px;padding:8px}.removedrow{font-size:13px;color:var(--muted);margin:6px 0}.error{background:#fff0ee;border:1px solid #efb8b1;padding:14px;border-radius:12px}.hidden{display:none}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.facts{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171d23;--text:#edf2f7;--muted:#9aa7b6;--line:#2d3742;--accent:#4c8dff}.fact,.legenditem{background:#1d252d}}
</style></head><body><main class="wrap"><h1>Wohnungssuche Leipzig</h1><p class="lead">Aktuelles, neu geranktes Wohnungs-Dashboard mit Preis, Größe, Einzug, Balkon, Zustand sowie Auto- und Motorradparken.</p><div id="chips" class="chips"></div><div class="stats"><div class="stat"><b id="count">–</b><span>aktive Angebote</span></div><div class="stat"><b id="best">–</b><span>bester Score</span></div><div class="stat"><b id="avg">–</b><span>Ø Warmmiete</span></div><div class="stat"><b id="updated">–</b><span>aktualisiert</span></div></div><div class="controls"><input id="q" placeholder="Adresse/Stadtteil"><select id="sort"><option value="rank">Ranking</option><option value="score">Score</option><option value="rent">Warmmiete</option><option value="area">Größe</option></select><label><input id="balcony" type="checkbox"> Balkon/Loggia</label><label><input id="parking" type="checkbox"> Parkoption bekannt</label></div><div id="err" class="error hidden"></div><section class="section"><h2>Top 3</h2><div id="podium" class="podium"></div></section><section class="section"><h2>Gesamtranking</h2><div id="cards" class="gridcards"></div></section><section class="section legend"><h2>Bewertungsschema</h2><div id="legend" class="legendgrid"></div></section><section class="section removed"><h2>Zuletzt entfernt</h2><div id="removed"></div></section></main>
<script>
const E=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n),N=n=>new Intl.NumberFormat('de-DE',{maximumFractionDigits:2}).format(n),S=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let DB;const B=a=>a.balcony&&!/^nein$/i.test(a.balcony),P=a=>a.carParking&&!/noch zu prüfen|unbekannt/i.test(a.carParking);function f(k,v){return `<div class="fact"><b>${k}</b><span>${v}</span></div>`}function c(a){return `<article class="card"><div class="rank">#${a.rank}</div><div class="score">${a.score}<small>/100</small></div><h3>${S(a.address)}</h3><p class="district">${S(a.district)}</p><div class="facts">${f('Warmmiete',S(a.warmRentText||E(a.warmRent)))}${f('Größe',N(a.area)+' m²')}${f('Zimmer',N(a.rooms))}${f('Einzug',S(a.moveIn))}${f('Balkon/Loggia',S(a.balcony))}${f('Zustand',S(a.condition))}</div><div class="line"><b>🚗 Auto</b><span>${S(a.carParking)}</span></div><div class="line"><b>🏍️ Motorrad</b><span>${S(a.motorcycleParking)}</span></div><div class="line"><b>Zusatzkosten</b><span>${S(a.extraCosts)}</span></div><a class="btn" href="${S(a.url)}" target="_blank" rel="noopener">Exposé öffnen</a>${a.note?`<p class="note">${S(a.note)}</p>`:''}</article>`}function render(){let l=[...DB.apartments],q=document.querySelector('#q').value.toLowerCase().trim();if(q)l=l.filter(a=>(a.address+' '+a.district).toLowerCase().includes(q));if(document.querySelector('#balcony').checked)l=l.filter(B);if(document.querySelector('#parking').checked)l=l.filter(P);let s=document.querySelector('#sort').value;l.sort(s==='rent'?(a,b)=>a.warmRent-b.warmRent:s==='area'?(a,b)=>b.area-a.area:s==='score'?(a,b)=>b.score-a.score:(a,b)=>a.rank-b.rank);document.querySelector('#cards').innerHTML=l.map(c).join('')||'<p>Keine Treffer.</p>'}async function init(){try{let r=await fetch('data.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);DB=await r.json();document.querySelector('#chips').innerHTML=[`Wunsch-Einzug: ${DB.desiredMoveIn}`,`spätestens ${DB.latestMoveIn}`,`max. ${E(DB.maxWarmRent)} warm`,`Auto: Einfahrt ≥ ${N(DB.vehicleHeight)} m`].map(x=>`<span class="chip">${S(x)}</span>`).join('')+`<a class="chip" target="_blank" rel="noopener" href="${S(DB.googleSheetUrl)}">Google Sheet öffnen</a>`;document.querySelector('#count').textContent=DB.apartments.length;document.querySelector('#best').textContent=Math.max(...DB.apartments.map(x=>x.score))+'/100';document.querySelector('#avg').textContent=E(DB.apartments.reduce((s,x)=>s+x.warmRent,0)/DB.apartments.length);document.querySelector('#updated').textContent=DB.updatedAt;document.querySelector('#podium').innerHTML=[...DB.apartments].sort((a,b)=>a.rank-b.rank).slice(0,3).map(c).join('');document.querySelector('#legend').innerHTML=DB.criteria.map(([k,p])=>`<div class="legenditem"><span>${S(k)}</span><b>${p} P.</b></div>`).join('');document.querySelector('#removed').innerHTML=(DB.removed||[]).map(x=>`<div class="removedrow"><b>${S(x.address)}</b> · ${S(x.status)} · ${S(x.removedAt)}</div>`).join('')||'Keine.';['q','sort','balcony','parking'].forEach(id=>document.querySelector('#'+id).addEventListener('input',render));render()}catch(e){document.querySelector('#err').classList.remove('hidden');document.querySelector('#err').textContent='Daten konnten nicht geladen werden: '+e.message}}init();
</script></body></html>
